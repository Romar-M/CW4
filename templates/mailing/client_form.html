{% extends 'base.html' %}

{% block title %}{% if object %}Редактировать клиента{% else %}Новый клиент{% endif %}{% endblock %}

{% block content %}
<h1>{% if object %}Редактировать клиента{% else %}Новый клиент{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{% url 'mailing:client_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
