{% extends 'base.html' %}

{% block title %}Удаление рассылки{% endblock %}

{% block content %}
<h1>Удаление рассылки</h1>
<p>Вы уверены, что хотите удалить рассылку #{{ object.id }} (тема: "{{ object.message.subject }}")?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'mailing:mailing_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
