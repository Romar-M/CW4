{% extends 'base.html' %}

{% block title %}Главная - Статистика рассылок{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <h1 class="mb-4">Статистика сервиса рассылок</h1>
        <div class="row">
            <div class="col-md-4">
                <div class="card text-white bg-primary mb-3">
                    <div class="card-header">Всего рассылок</div>
                    <div class="card-body">
                        <h2 class="card-title">{{ total_mailings }}</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3">
                    <div class="card-header">Активных рассылок</div>
                    <div class="card-body">
                        <h2 class="card-title">{{ active_mailings }}</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-info mb-3">
                    <div class="card-header">Уникальных клиентов</div>
                    <div class="card-body">
                        <h2 class="card-title">{{ unique_clients }}</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
